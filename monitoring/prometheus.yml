global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'argus-ingestion-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['argus-ingestion-api:8100']
    # Spring Boot Actuator requires no auth on /actuator by default (ApiKeyAuthFilter excludes it)
